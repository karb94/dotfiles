# This is an example Hyprland config file.
#
# Refer to the wiki for more information.

#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,preferred,auto,auto
# render:cm_fs_passthrough=0
render {
  cm_enabled = false
  cm_auto_hdr = 0
}

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
exec-once = swaybg --color \#1d2021
exec-once = [workspace 1 silent] brave
exec-once = [workspace 2 silent] alacritty

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Some default env vars.
# env = XCURSOR_SIZE,144


# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us,ru
    kb_variant = ,phonetic_winkeys
    kb_model =
    kb_options = grp:alt_space_toggle
    kb_rules =
    repeat_rate = 25
    repeat_delay = 200
    accel_profile = flat

    follow_mouse = 2
    mouse_refocus = false

    float_switch_override_focus = 0
    touchpad {
        natural_scroll = false
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    no_focus_fallback = true
    gaps_in = 3
    gaps_out = 0
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = master
}

cursor {
  inactive_timeout = 1
  hide_on_key_press = true
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 10
    # blur = true
    # blur_size = 3
    # blur_passes = 1
    # blur_new_optimizations = true
}

animations {
    enabled = true

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.5, 0.0, 0.75, 0.7

    animation = windowsMove, 1, 2, myBezier
    animation = windowsIn, 1, 2, myBezier, slide
    animation = windowsOut, 1, 2, myBezier, slide
    animation = border, 1, 7, default
    animation = borderangle, 1, 7, myBezier
    animation = fade, 1, 1, myBezier
    animation = workspaces, 1, 2, myBezier
}

misc {
    force_default_wallpaper = 0
}

master {
  # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
  # pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
  # preserve_split = true # you probably want this
  mfact = 0.66
  allow_small_split = true
  orientation = right
}
dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    # pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    # preserve_split = true # you probably want this
    force_split = 2
}

# gestures {
#     # See https://wiki.hyprland.org/Configuring/Variables/ for more
#     workspace_swipe = false
# }

ecosystem {
  no_update_news = true
}

# Example windowrule v1
# windowrule = float, ^(mpv)$
# Example windowrule v2
windowrulev2 = float,class:^(mpv)$
windowrulev2 = keepaspectratio,class:^(mpv)$
layerrule = animation slide, notifications
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more


# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = SUPER, S, exec, alacritty
bind = SUPER, N, exec, dunstctl action
bind = SUPER, C, killactive,
bind = SUPER, Q, exit,
bind = SUPER, V, togglefloating,
bind = SUPER, slash, exec, rofi -show drun
bind = SUPER, P, pseudo, # dwindle
# bind = SUPER, J, togglesplit, # dwindle
bind = SUPER SHIFT, S, exec, grim -g "$(slurp -d)" - | wl-copy

# Move focus with mainMod + arrow keys
bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d
bind = SUPER SHIFT, H, swapwindow, l
bind = SUPER SHIFT, L, swapwindow, r
bind = SUPER SHIFT, K, swapwindow, u
bind = SUPER SHIFT, J, swapwindow, d
bind = SUPER, R, resizeactive, 500 100%
bind = SUPER, T, togglefloating, active
bind = SUPER, F, fullscreen, 0
bind = SUPER, equal, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+ && wob_volume
bind = SUPER, minus, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%- && wob_volume
bind = SUPER SHIFT, F, focuswindow, floating:1
bind = SUPER SHIFT, T, focuswindow, tiled:1

# Switch workspaces with mainMod + [0-9]
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10
bind = SUPER, period, workspace, e+1
bind = SUPER, comma, workspace, e-1

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5

bind = SUPER, M, submap, move
submap = move
# Move window to a different workspace
bind = , 1, movetoworkspace, 1
bind = , 1, submap, reset
bind = , 2, movetoworkspace, 2
bind = , 2, submap, reset
bind = , 3, movetoworkspace, 3
bind = , 3, submap, reset
bind = , 4, movetoworkspace, 4
bind = , 4, submap, reset
bind = , 5, movetoworkspace, 5
bind = , 5, submap, reset

# Move window to a different location
bind = , h, movewindow, l
bind = , h, submap, reset
bind = , j, movewindow, d
bind = , j, submap, reset
bind = , k, movewindow, u
bind = , k, submap, reset
bind = , l, movewindow, r
bind = , l, submap, reset
# bind = , escape, submap, reset
submap = reset

# Scroll through existing workspaces with mainMod + scroll
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
